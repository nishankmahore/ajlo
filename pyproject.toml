[project]
name = "ajlo"
version = "0.1.0"

description = "Adaptive Join-Aware Layout Optimizer (AJLO): query-history-driven physical layout optimization for open-source lakehouse systems"

readme = "README.md"

authors = [

]

maintainers = [

]

license = { text = "Apache-2.0" }

requires-python = ">=3.11"

keywords = [
    "lakehouse",
    "delta-lake",
    "apache-spark",
    "physical-design",
    "liquid-clustering",
    "data-engineering"
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",

    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",

    "Operating System :: OS Independent"
]

dependencies = [
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "numpy>=1.26",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "faker>=22.0",
    "pytest>=8.0",
    "rich>=15.0.0",
    "click>=8.4.1",
    "seaborn>=0.13.2"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ajlo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"